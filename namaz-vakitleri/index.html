<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Namaz Vakitleri ve Kalan Süre Sayacı</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    .countdown-box {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }
    .countdown-box h3 {
      margin: 0;
      color: #2e7d32;
      font-size: 18px;
    }
    .timer {
      font-size: 26px;
      font-weight: bold;
      color: #1b5e20;
      margin-top: 8px;
    }
    .vakitler-list {
      margin-top: 20px;
      list-style: none;
      padding: 0;
    }
    .vakitler-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }
    .vakitler-list li.active {
      background-color: #e3f2fd;
      font-weight: bold;
      color: #1565c0;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Namaz Vakitleri</h2>
  
  <div class="form-group">
    <label for="citySelect">Şehir Seçin:</label>
    <select id="citySelect" onchange="getPrayerTimes()">
      <option value="Adana">Adana</option>
      <option value="Adiyaman">Adıyaman</option>
      <option value="Afyonkarahisar">Afyonkarahisar</option>
      <option value="Agri">Ağrı</option>
      <option value="Amasya">Amasya</option>
      <option value="Ankara" selected>Ankara</option>
      <option value="Antalya">Antalya</option>
      <option value="Artvin">Artvin</option>
      <option value="Aydin">Aydın</option>
      <option value="Balikesir">Balıkesir</option>
      <option value="Bilecik">Bilecik</option>
      <option value="Bingol">Bingöl</option>
      <option value="Bitlis">Bitlis</option>
      <option value="Bolu">Bolu</option>
      <option value="Burdur">Burdur</option>
      <option value="Bursa">Bursa</option>
      <option value="Canakkale">Çanakkale</option>
      <option value="Cankiri">Çankırı</option>
      <option value="Corum">Çorum</option>
      <option value="Denizli">Denizli</option>
      <option value="Diyarbakir">Diyarbakır</option>
      <option value="Edirne">Edirne</option>
      <option value="Elazig">Elazığ</option>
      <option value="Erzincan">Erzincan</option>
      <option value="Erzurum">Erzurum</option>
      <option value="Eskisehir">Eskişehir</option>
      <option value="Gaziantep">Gaziantep</option>
      <option value="Giresun">Giresun</option>
      <option value="Gumushane">Gümüşhane</option>
      <option value="Hakkari">Hakkari</option>
      <option value="Hatay">Hatay</option>
      <option value="Isparta">Isparta</option>
      <option value="Mersin">Mersin</option>
      <option value="Istanbul">İstanbul</option>
      <option value="Izmir">İzmir</option>
      <option value="Kars">Kars</option>
      <option value="Kastamonu">Kastamonu</option>
      <option value="Kayseri">Kayseri</option>
      <option value="Kirklareli">Kırklareli</option>
      <option value="Kirsehir">Kırşehir</option>
      <option value="Kocaeli">Kocaeli</option>
      <option value="Konya">Konya</option>
      <option value="Kutahya">Kütahya</option>
      <option value="Malatya">Malatya</option>
      <option value="Manisa">Manisa</option>
      <option value="Kahramanmaras">Kahramanmaraş</option>
      <option value="Mardin">Mardin</option>
      <option value="Mugla">Muğla</option>
      <option value="Mus">Muş</option>
      <option value="Nevsehir">Nevşehir</option>
      <option value="Nigde">Niğde</option>
      <option value="Ordu">Ordu</option>
      <option value="Rize">Rize</option>
      <option value="Sakarya">Sakarya</option>
      <option value="Samsun">Samsun</option>
      <option value="Siirt">Siirt</option>
      <option value="Sinop">Sinop</option>
      <option value="Sivas">Sivas</option>
      <option value="Tekirdag">Tekirdağ</option>
      <option value="Tokat">Tokat</option>
      <option value="Trabzon">Trabzon</option>
      <option value="Tunceli">Tunceli</option>
      <option value="Sanliurfa">Şanlıurfa</option>
      <option value="Usak">Uşak</option>
      <option value="Van">Van</option>
      <option value="Yozgat">Yozgat</option>
      <option value="Zonguldak">Zonguldak</option>
      <option value="Aksaray">Aksaray</option>
      <option value="Bayburt">Bayburt</option>
      <option value="Karaman">Karaman</option>
      <option value="Kirikkale">Kırıkkale</option>
      <option value="Batman">Batman</option>
      <option value="Sirnak">Şırnak</option>
      <option value="Bartin">Bartın</option>
      <option value="Ardahan">Ardahan</option>
      <option value="Igdir">Iğdır</option>
      <option value="Yalova">Yalova</option>
      <option value="Karabuk">Karabük</option>
      <option value="Kilis">Kilis</option>
      <option value="Osmaniye">Osmaniye</option>
      <option value="Duzce">Düzce</option>
    </select>
  </div>

  <div class="countdown-box">
    <h3 id="nextPrayerName">Sonraki Namaza Kalan Süre</h3>
    <div class="timer" id="countdownTimer">Hesaplanıyor...</div>
  </div>

  <ul class="vakitler-list" id="vakitlerList">
    <!-- Namaz vakitleri buraya yüklenecek -->
  </ul>
</div>

<script>
  let prayerTimesData = {};
  let timerInterval;

  async function getPrayerTimes() {
    const city = document.getElementById('citySelect').value;
    const url = `https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Turkey&method=13`;

    try {
      const response = await fetch(url);
      const data = await response.json();
      const timings = data.data.timings;

      prayerTimesData = {
        "İmsak": timings.Fajr,
        "Güneş": timings.Sunrise,
        "Öğle": timings.Dhuhr,
        "İkindi": timings.Asr,
        "Akşam": timings.Maghrib,
        "Yatsı": timings.Isha
      };

      displayPrayerTimes();
      startCountdown();
    } catch (error) {
      console.error("Vakitler alınamadı:", error);
      document.getElementById('countdownTimer').innerText = "Hata oluştu.";
    }
  }

  function displayPrayerTimes() {
    const list = document.getElementById('vakitlerList');
    list.innerHTML = '';

    for (const [vakit, saat] of Object.entries(prayerTimesData)) {
      const li = document.createElement('li');
      li.id = `vakit-${vakit}`;
      li.innerHTML = `<span>${vakit}</span> <span>${saat}</span>`;
      list.appendChild(li);
    }
  }

  function startCountdown() {
    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      const now = new Date();
      let nextPrayer = null;
      let nextPrayerTime = null;

      // Aktif sınıfları temizle
      document.querySelectorAll('.vakitler-list li').forEach(el => el.classList.remove('active'));

      for (const [vakit, saat] of Object.entries(prayerTimesData)) {
        const [hours, minutes] = saat.split(':');
        const prayerDate = new Date();
        prayerDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

        if (prayerDate > now) {
          nextPrayer = vakit;
          nextPrayerTime = prayerDate;
          break;
        }
      }

      // Eğer bugünkü tüm vakitler geçtiyse sonraki vakit yarınki İmsak'tır
      if (!nextPrayerTime) {
        nextPrayer = "İmsak (Yarın)";
        const [hours, minutes] = prayerTimesData["İmsak"].split(':');
        nextPrayerTime = new Date();
        nextPrayerTime.setDate(now.getDate() + 1);
        nextPrayerTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
      }

      // Aktif olan vakti listede vurgula
      if (nextPrayer && document.getElementById(`vakit-${nextPrayer.replace(' (Yarın)', '')}`)) {
        document.getElementById(`vakit-${nextPrayer.replace(' (Yarın)', '')}`).classList.add('active');
      }

      const diffMs = nextPrayerTime - now;
      const diffMinutes = Math.floor(diffMs / 60000);
      const diffSeconds = Math.floor((diffMs % 60000) / 1000);
      const hoursLeft = Math.floor(diffMinutes / 60);
      const minsLeft = diffMinutes % 60;

      document.getElementById('nextPrayerName').innerText = `${nextPrayer} Vaktine Kalan Süre`;
      document.getElementById('countdownTimer').innerText = `${hoursLeft > 0 ? hoursLeft + ' sa ' : ''}${minsLeft} dk ${diffSeconds} dn`;

    }, 1000);
  }

  // Sayfa yüklendiğinde çalıştır
  getPrayerTimes();
</script>

</body>
</html>
