        * { box-sizing: border-box; }
        html, body {
            margin: 0;

            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
        }

        /* Üst Bilgi ve Reklam Çubuğu */
        .top-bar {
            height: 75px;
            background: #0056b3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            z-index: 100;
        }

        .top-bar a.brand {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .top-bar .btn-close {
            background: #ffffff;
            color: #0056b3;
            font-weight: bold;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* Reklam Alanı Çerçevesi */
        .ad-box {
            max-height: 60px;
            overflow: hidden;
        }

        /* İçerik Alanı */
        .content-area {
            position: relative;
            width: 100%;
            height: calc(100% - 115px); /* Üst bar + Alt sayaç yüksekliği düşüldü */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: white;
        }

        .loading-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            z-index: 1;
        }

        .loading-card h2 { font-size: 18px; color: #333; margin-bottom: 10px; }
        .loading-card p { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4; }
        
        .btn-direct {
            display: inline-block;
            background: #0056b3;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Alt Ziyaretçi Sayacı Barı */
        .bottom-counter {
            height: 40px;
            background: #ffffff;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 100;
        }
    </style>
</head>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = urlParams.get('q');

        if (targetUrl) {
            targetUrl = decodeURIComponent(targetUrl);

            if (targetUrl.includes("news.google.com")) {
