<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nearadin.net - Haber Detayı</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Üst Bilgi ve Reklam Çubuğu */
        .top-bar {
            height: 70px;
            background: #0056b3;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
        }

        .top-bar a.brand {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .top-bar .ad-box {
            max-height: 60px;
            overflow: hidden;
        }

        .top-bar .btn-close {
            background: #ffffff;
            color: #c62828;
            font-weight: bold;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Haberin Gösterileceği İframe Kutusu */
        .iframe-container {
            width: 100%;
            height: calc(100% - 70px);
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Admatic AUTO ads START -->
<ins data-publisher="adm-pub-342021502" data-ad-network="6938571fadda546eb28ca492"   class="adm-ads-area"></ins>
<script type="text/javascript" src="https://static.cdn.admatic.com.tr/showad/showad.min.js"></script>
<!-- Admatic AUTO ads END -->

    <!-- Sitenizin Üst Menüsü ve Admatic Reklamı -->
    <div class="top-bar">
        <a href="https://nearadin.net/" class="brand">← nearadin.net</a>
        
        <!-- Admatic Reklam Alanı -->
        <div class="ad-box">
            <ins data-publisher="adm-pub-342021502" data-ad-network="6938571fadda546eb28ca492" class="adm-ads-area"></ins>
            <script type="text/javascript" src="https://static.cdn.admatic.com.tr/showad/showad.min.js"></script>
        </div>

        <a href="https://nearadin.net/" class="btn-close">Ana Sayfaya Dön</a>
    </div>

    <!-- Dış Sayfanın Gösterileceği Alan -->
    <div class="iframe-container">
        <iframe id="news-frame" src="" title="Haber İçeriği" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
    </div>

    <script>
        // URL'deki ?q= parametresinden hedef haber linkini alıp iframe'e yükler
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = urlParams.get('q');

        if (targetUrl) {
            if (targetUrl.includes("url?q=")) {
                targetUrl = targetUrl.split("url?q=")[1].split("&")[0];
            }
            targetUrl = decodeURIComponent(targetUrl);
            
            document.getElementById('news-frame').src = targetUrl;
        } else {
            window.location.href = "https://nearadin.net/";
        }
    </script>
</body>
</html>
