<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haber Detayı - nearadin.net</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        #news-frame { width: 100%; height: 100%; border: none; }
        .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 18px; color: #555; }
    </style>
</head>
<body>

    <div id="loading" class="loading">Haber Yükleniyor...</div>
    
    <!-- allow-same-origin kaldırıldı: dış siteler ana sayfayı yönlendiremez -->
    <iframe 
        id="news-frame" 
        style="display:none;" 
        sandbox="allow-scripts allow-forms allow-popups allow-modals"
        onload="document.getElementById('loading').style.display='none'; this.style.display='block';">
    </iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = urlParams.get('q');

        if (targetUrl) {
            targetUrl = decodeURIComponent(targetUrl);
            const frame = document.getElementById('news-frame');

            // Hiçbir koşulda window.location kullanmıyoruz.
            // Sadece iframe src'ye yüklüyoruz.
            frame.src = targetUrl;
        } else {
            window.location.href = "https://nearadin.net/";
        }
    </script>
</body>
</html>
