name: Tüm Sayfaları Güncelle ve Yayınla

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı otomatik çalışır
  workflow_dispatch:      # Elle tetiklemeye izin verir

permissions:
  contents: write         # Depoya yeni HTML/JSON dosyalarını basmak için şarttır

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Haberleri Çek ve Sayfaları Üret
        run: |
          python fetch_news.py  # Python dosyanızın adı main.py değilse burayı güncelleyin
                 
      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --staged --quiet || git commit -m "Otomatik Güncelleme: Haberler Yenilendi"
          git push
