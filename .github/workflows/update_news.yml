name: Tüm Sayfaları Güncelle ve Yayınla

on:
  schedule:
    - cron: '0 */1 * * *'  # Her saat başı çalışır
  workflow_dispatch:      # Elle tetiklemeye izin verir

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tweepy




      # 1. Tüm Değişiklikleri Tek Seferde Commit Et ve Push Et
      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Otomatik Güncelleme: Haberler ve Seçim Anketi Yenilendi" || exit 0
          git push
