name: Haberleri Güncelle ve Deploy Et

on:
  schedule:
    - cron: '0 */1 * * *'  # Her saat başı çalışır
  workflow_dispatch:      # Elle tetiklemeye izin verir

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v3

      - name: Python Ortamini Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 🔴 İŞTE EKSİK OLAN ADIM BURASI:
      - name: Kütüphaneleri Yükle (Tweepy)
        run: |
          python -m pip install --upgrade pip
          pip install tweepy
          pip install tweepy beautifulsoup4 requests


      - name: Haberi Cek ve HTML Uret
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python fetch_news.py

      - name: Degisiklikleri Commit Et ve Push Et
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Son dakika haberleri ve X paylaşımı güncellendi" || exit 0
          git push
