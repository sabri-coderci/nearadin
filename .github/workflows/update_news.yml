name: nearadin.net Otomatik Haber

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v3

      - name: Python Ortamini Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Haberi Cek ve HTML Uret
        run: python fetch_news.py

      - name: Degisiklikleri Commit Et ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml haber/
          git commit -m "Otomatik haber sayfaları ve sitemap guncellemesi [skip ci]" || exit 0
          git push
