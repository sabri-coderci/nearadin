name: Tüm Sayfaları Güncelle ve Yayınla

on:
  schedule:
    - cron: '0 */1 * * *'  # Her saat başı çalışır
  workflow_dispatch:      # Elle tetiklemeye izin verir

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Excel Dosyasını Oluştur
        run: python secim-anketi/make_excel.py

      - name: Seçim Anketi HTML Üret
        run: python secim-anketi/generate_secim.py


      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tweepy

      # 1. Ana Haber Sayfalarını Üret
      - name: Ana Haberleri Çek ve HTML Üret
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python fetch_news.py

      # 2. Seçim Anketi Sayfasını Üret
      - name: Seçim Anketi HTML Üret
        run: python secim-anketi/generate_secim.py

      # 3. Tüm Değişiklikleri Tek Seferde Commit Et ve Push Et
      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Otomatik Güncelleme: Haberler ve Seçim Anketi Yenilendi" || exit 0
          git push
