name: Haberleri Güncelle

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada bir (GitHub zaman zaman birkaç dakika geciktirebilir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install tweepy

      - name: Haberleri üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_MIN_INTERVAL_MINUTES: "30"
        run: python fetch_news.py

      - name: Değişiklikleri depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Haberler güncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
