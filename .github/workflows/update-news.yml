name: Haberleri Güncelle

on:
  schedule:
    - cron: "*/15 * * * *"   # her 15 dakikada bir (GitHub bazen birkaç dakika geciktirir)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install tweepy

      - name: Haberleri üret
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_MIN_INTERVAL_MINUTES: "60"   # en fazla saatte 1 X paylaşımı (0 = her çalışmada)
        run: python fetch_news.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Haberler güncellendi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
