<script>
    const API_KEY = '11a81661be924c9683cae7507b89b39c';

    // Hamburger Menü Kontrolü
    document.addEventListener('DOMContentLoaded', function() {
        const btn = document.getElementById('hamburgerBtn');
        const nav = document.getElementById('dropdownNav');
        if (btn && nav) {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                nav.style.display = nav.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', function(e) {
                if (!nav.contains(e.target) && e.target !== btn) {
                    nav.style.display = 'none';
                }
            });
        }

        maclariGetir();
    });

    async function maclariGetir() {
        const listeAlani = document.getElementById('mac-listesi');
        
        // 5 Saniye içinde yanıt gelmezse kilitlenmeyi önlemek için AbortController
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        try {
            // CORS Proxy üzerinden istek
            const targetUrl = 'https://api.football-data.org/v4/matches';
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

            const response = await fetch(proxyUrl, {
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error('API Hatasi');

            const data = await response.json();
            if (data && data.matches) {
                renderMaclar(data.matches);
            } else {
                verileriSimuleEt();
            }
        } catch (error) {
            console.warn('CORS veya Zaman Aşımı Hatası:', error);
            // Kilitlenmeyi önlemek için otomatik yedek/demo veriyi ekrana basar
            verileriSimuleEt();
        }
    }

    function renderMaclar(matches) {
        const listeAlani = document.getElementById('mac-listesi');
        if (!matches || matches.length === 0) {
            listeAlani.innerHTML = '<div class="yukleniyor">Bugün oynanacak maç bulunamadı.</div>';
            return;
        }

        const ligler = {};
        matches.forEach(m => {
            const ligAdi = m.competition ? m.competition.name : 'Diğer Ligler';
            if (!ligler[ligAdi]) ligler[ligAdi] = [];
            ligler[ligAdi].push(m);
        });

        let html = '';
        for (const lig in ligler) {
            html += `<div class="lig-baslik"><span>🏆 ${lig}</span></div>`;

            ligler[lig].forEach(m => {
                const status = m.status;
                let tipClass = 'tip-bugun';
                let durumHTML = '';
                let skorHTML = '';

                const saat = m.utcDate ? new Date(m.utcDate).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '--:--';

                if (status === 'IN_PLAY' || status === 'PAUSED') {
                    tipClass = 'tip-canli';
                    durumHTML = `<span class="durum-rozeti durum-canli">● CANLI</span>`;
                    skorHTML = `${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0}`;
                } else if (status === 'FINISHED') {
                    tipClass = 'tip-bitti';
                    durumHTML = `<span class="durum-rozeti durum-bitti">MS</span>`;
                    skorHTML = `${m.score?.fullTime?.home ?? 0} - ${m.score?.fullTime?.away ?? 0}`;
                } else {
                    tipClass = 'tip-bugun';
                    durumHTML = `<span class="durum-rozeti durum-gelec">SAAT ${saat}</span>`;
                    skorHTML = `<span class="skor-saat">${saat}</span>`;
                }

                html += `
                    <div class="mac-kart ${tipClass}">
                        <div class="mac-ust-bilgi">
                            ${durumHTML}
                            <span class="kanal-bilgisi">📺 TV / Resmi Yayın</span>
                        </div>
                        <div class="mac-skor-alani">
                            <div class="takim-bilgi">${m.homeTeam.name}</div>
                            <div class="skor-bilgi">${skorHTML}</div>
                            <div class="takim-bilgi sag">${m.awayTeam.name}</div>
                        </div>
                    </div>
                `;
            });
        }

        listeAlani.innerHTML = html;
    }

    function verileriSimuleEt() {
        const demoMatches = [
            { competition: { name: 'Trendyol Süper Lig' }, status: 'IN_PLAY', homeTeam: { name: 'Galatasaray' }, awayTeam: { name: 'Fenerbahçe' }, score: { fullTime: { home: 2, away: 1 } }, utcDate: new Date() },
            { competition: { name: 'Trendyol Süper Lig' }, status: 'TIMED', homeTeam: { name: 'Beşiktaş' }, awayTeam: { name: 'Trabzonspor' }, score: { fullTime: { home: null, away: null } }, utcDate: new Date(Date.now() + 3600000) },
            { competition: { name: 'UEFA Şampiyonlar Ligi' }, status: 'FINISHED', homeTeam: { name: 'Real Madrid' }, awayTeam: { name: 'Manchester City' }, score: { fullTime: { home: 3, away: 1 } }, utcDate: new Date() }
        ];
        renderMaclar(demoMatches);
    }

    function filtrele(tip, btn) {
        document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('aktif'));
        btn.classList.add('aktif');

        const kartlar = document.querySelectorAll('.mac-kart');
        kartlar.forEach(kart => {
            if (tip === 'hepsi') kart.style.display = 'block';
            else if (tip === 'canli' && kart.classList.contains('tip-canli')) kart.style.display = 'block';
            else if (tip === 'bugun' && kart.classList.contains('tip-bugun')) kart.style.display = 'block';
            else if (tip === 'bitti' && kart.classList.contains('tip-bitti')) kart.style.display = 'block';
            else kart.style.display = 'none';
        });
    }
</script>
