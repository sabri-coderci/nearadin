<!-- SİNEMA KONTROL MERKEZİ VE OYNATICI -->
<div id="sinema-kontrol-merkezi">
    <div class="sinema-wrapper">
        <div id="izlenen-bilgi">
            <span class="canli-etiket">ŞU AN İZLENİYOR</span>
            <span id="film-adi-aktif">Bir film seçin...</span>
        </div>
        <button id="film-kapat-btn" onclick="filmDurdur()">KAPAT ✕</button>
    </div>
    
    <div id="video-oynatici-alan">
        <div class="video-kapsayici">
            <iframe id="film-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen frameborder="0"></iframe>
        </div>
    </div>
</div>

<!-- FİLM GALERİSİ -->
<section class="film-galerisi">
    <header>
        <h2 class="galeri-baslik">Özel Sinema Seçkisi - Türkçe Dublaj</h2>
        <p class="galeri-alt">nearadin.net tarafından derlenen yüksek çözünürlüklü yabancı filmler.</p>
    </header>
    <div id="canli-sonuc-listesi">
        <div class="yukleniyor">Film arşivi yükleniyor...</div>
    </div>
</section>

<style>
    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
    }

    :root { 
        --sinema-ana: #e74c3c; 
        --sinema-koyu: #121212; 
    }

    body {
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #sinema-kontrol-merkezi {
        position: sticky; top: 0; z-index: 9999;
        background: var(--sinema-koyu); color: #fff;
        padding: 8px 12px; border-bottom: 3px solid var(--sinema-ana);
        width: 100%;
    }
    
    .sinema-wrapper { 
        display: flex; align-items: center; justify-content: space-between; 
        max-width: 800px; margin: auto; width: 100%;
    }

    #izlenen-bilgi { flex: 1; min-width: 0; margin-right: 10px; }
    .canli-etiket { font-size: 9px; color: var(--sinema-ana); font-weight: bold; letter-spacing: 1px; display: block; }
    #film-adi-aktif { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #film-kapat-btn {
        background: var(--sinema-ana); color: white; border: none;
        padding: 5px 10px; border-radius: 4px; cursor: pointer;
        font-weight: bold; font-size: 10px; flex-shrink: 0;
        display: none;
    }

    #video-oynatici-alan { max-width: 800px; margin: 10px auto 5px; display: none; width: 100%; }
    .video-kapsayici { 
        position: relative; padding-bottom: 56.25%; height: 0; 
        overflow: hidden; border-radius: 8px; background: #000;
        box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
    }
    .video-kapsayici iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .film-galerisi { max-width: 800px; margin: 20px auto; padding: 0 12px; width: 100%; }
    .galeri-baslik { font-size: 18px; font-weight: 800; color: #222; margin: 0 0 4px 0; word-break: break-word; }
    .galeri-alt { color: #666; margin-bottom: 15px; font-size: 12px; line-height: 1.4; }
    
    .film-kart-ozel {
        display: flex; align-items: center; padding: 10px; background: #fff;
        border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;
        cursor: pointer; transition: background 0.2s;
        width: 100%;
    }
    .film-kart-ozel:hover { background: #fff8f7; }
    .film-kart-ozel.aktif { border-left: 5px solid var(--sinema-ana); background: #fef5f4; }
    
    .film-resim { 
        width: 95px; height: 58px; border-radius: 6px; 
        margin-right: 10px; object-fit: cover; flex-shrink: 0; 
    }
    
    /* Mobil Yazı Hizalama ve Taşma Engelleme */
    .film-metin { 
        font-weight: 600; font-size: 13px; color: #1c1e21; 
        flex: 1; min-width: 0; margin: 0; line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; text-overflow: ellipsis;
    }
    
    .oynat-simge { color: var(--sinema-ana); font-size: 16px; margin-left: 8px; flex-shrink: 0; }
    .yukleniyor { text-align: center; padding: 30px; color: #888; font-style: italic; font-size: 13px; }

    /* Ekstra Küçük Ekranlar (Mobil Uyum) */
    @media (max-width: 480px) {
        .film-resim { width: 85px; height: 52px; margin-right: 8px; }
        .film-metin { font-size: 12px; }
        .galeri-baslik { font-size: 16px; }
    }
</style>

<script>
    const filmArsivi = [
        {
            id: 'aYbUTg-bfUU',
            baslik: 'Aksiyon Dolu Yabancı Film - Türkçe Dublaj Full HD',
            resim: 'https://img.youtube.com/vi/aYbUTg-bfUU/hqdefault.jpg'
        },
        {
            id: 'vcMqEy6udI8',
            baslik: 'Sürükleyici Gerilim & Macera - Türkçe Dublaj Tek Parça',
            resim: 'https://img.youtube.com/vi/vcMqEy6udI8/hqdefault.jpg'
        },
        {
            id: 'U_uL_kFVdMU',
            baslik: 'Yüksek Tempolu Sinema Kuşağı - Türkçe Dublaj İzle',
            resim: 'https://img.youtube.com/vi/U_uL_kFVdMU/hqdefault.jpg'
        },
        {
            id: 'F-VEUnkkrPQ',
            baslik: 'Kesintisiz Aksiyon & Suç Filmi - Full HD Sinema',
            resim: 'https://img.youtube.com/vi/F-VEUnkkrPQ/hqdefault.jpg'
        },
        {
            id: 'U06i7AO53mM',
            baslik: 'Bilinmeyen Adada Hayatta Kalma Mücadelesi - Macera Filmi',
            resim: 'https://img.youtube.com/vi/U06i7AO53mM/hqdefault.jpg'
        }
    ];

    function yukleFilmListesi() {
        const container = document.getElementById('canli-sonuc-listesi');
        container.innerHTML = '';
        
        filmArsivi.forEach(film => {
            const card = document.createElement('article');
            card.className = 'film-kart-ozel';
            card.onclick = () => startMovie(film.id, film.baslik, card);
            card.innerHTML = `
                <img src="${film.resim}" class="film-resim" alt="${film.baslik}">
                <h3 class="film-metin">${film.baslik}</h3>
                <div class="oynat-simge">▶</div>
            `;
            container.appendChild(card);
        });
    }

    function startMovie(id, title, el) {
        const frame = document.getElementById('film-iframe');
        const container = document.getElementById('video-oynatici-alan');
        const btn = document.getElementById('film-kapat-btn');
        const baslik = document.getElementById('film-adi-aktif');
        
        frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        container.style.display = 'block';
        btn.style.display = 'block';
        baslik.innerText = title;
        
        document.querySelectorAll('.film-kart-ozel').forEach(k => k.classList.remove('aktif'));
        el.classList.add('aktif');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filmDurdur() {
        const frame = document.getElementById('film-iframe');
        frame.src = '';
        document.getElementById('video-oynatici-alan').style.display = 'none';
        document.getElementById('film-kapat-btn').style.display = 'none';
        document.getElementById('film-adi-aktif').innerText = 'Bir film seçin...';
        document.querySelectorAll('.film-kart-ozel').forEach(k => k.classList.remove('aktif'));
    }

    document.addEventListener('DOMContentLoaded', yukleFilmListesi);
</script>
