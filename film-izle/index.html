<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yabancı Sinema - Dinamik Film Akışı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #e50914;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        header p {
            color: #aaa;
            font-size: 1rem;
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #ff9800;
            margin-top: 40px;
        }
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .film-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .film-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
        }
        .film-content {
            padding: 15px;
        }
        .film-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .film-date {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
        }
        .watch-btn {
            display: block;
            text-align: center;
            background-color: #e50914;
            color: #fff;
            text-decoration: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .watch-btn:hover {
            background-color: #b20710;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Yabancı Sinema - Güncel Filmler</h1>
        <p>Kanalın en son yayınlanan videoları dinamik olarak çekilmektedir.</p>
    </header>

    <div id="loading">Dinamik veriler YouTube'dan yükleniyor...</div>
    <div id="film-grid" class="film-grid"></div>

    <script>
        // Yabancı Sinema RSS Beslemesi
        const rssFeedUrl = 'https://www.youtube.com/feeds/videos.xml?user=YabancSinema';
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssFeedUrl)}`;

        async function fetchLatestMovies() {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('film-grid');

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    loadingEl.style.display = 'none';
                    
                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'film-card';

                        const pubDate = new Date(item.pubDate).toLocaleDateString('tr-TR', {
                            year: 'numeric', month: 'long', day: 'numeric'
                        });

                        card.innerHTML = `
                            <div class="film-content">
                                <h2 class="film-title">${item.title}</h2>
                                <p class="film-date">Yayınlanma Tarihi: ${pubDate}</p>
                            </div>
                            <div style="padding: 0 15px 15px 15px;">
                                <a href="${item.link}" target="_blank" class="watch-btn">Filmi İzle</a>
                            </div>
                        `;
                        gridEl.appendChild(card);
                    });
                } else {
                    loadingEl.textContent = 'Videolar çekilirken bir sorun oluştu veya video bulunamadı.';
                }
            } catch (error) {
                console.error('Hata:', error);
                loadingEl.textContent = 'Veriler yüklenirken bir ağ hatası oluştu.';
            }
        }

        // Sayfa yüklendiğinde videoları çek
        fetchLatestMovies();
    </script>
</body>
</html>
