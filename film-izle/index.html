<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Dublaj HD Film İzle - nearadin.net</title>
    <meta name="description" content="En güncel Türkçe dublaj yabancı filmler, aksiyon ve macera yapımları tek sayfada kesintisiz izleyin." />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --sinema-ana: #e74c3c; --sinema-koyu: #121212; }
        body { overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; }

        /* Üst Yapışkan Oynatıcı Barı */
        #sinema-kontrol-merkezi {
            position: sticky; top: 0; z-index: 9999;
            background: var(--sinema-koyu); color: #fff;
            padding: 8px 12px; border-bottom: 3px solid var(--sinema-ana); width: 100%;
        }
        .sinema-wrapper { display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: auto; }
        #izlenen-bilgi { flex: 1; min-width: 0; margin-right: 10px; }
        .canli-etiket { font-size: 9px; color: var(--sinema-ana); font-weight: bold; letter-spacing: 1px; display: block; }
        #film-adi-aktif { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #film-kapat-btn {
            background: var(--sinema-ana); color: white; border: none;
            padding: 5px 10px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 10px; flex-shrink: 0; display: none;
        }

        #video-oynatici-alan { max-width: 800px; margin: 10px auto 5px; display: none; width: 100%; }
        .video-kapsayici { 
            position: relative; padding-bottom: 56.25%; height: 0; 
            overflow: hidden; border-radius: 8px; background: #000; box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
        }
        .video-kapsayici iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Film Galerisi */
        .film-galerisi { max-width: 800px; margin: 20px auto; padding: 0 12px; width: 100%; }
        .galeri-baslik { font-size: 18px; font-weight: 800; color: #222; margin-bottom: 4px; }
        .galeri-alt { color: #666; margin-bottom: 15px; font-size: 12px; }
        
        .film-kart-ozel {
            display: flex; align-items: center; padding: 10px; background: #fff;
            border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;
            cursor: pointer; transition: background 0.2s; width: 100%;
        }
        .film-kart-ozel:hover { background: #fff8f7; }
        .film-kart-ozel.aktif { border-left: 5px solid var(--sinema-ana); background: #fef5f4; }
        
        .film-resim { width: 95px; height: 58px; border-radius: 6px; margin-right: 10px; object-fit: cover; flex-shrink: 0; }
        .film-metin { 
            font-weight: 600; font-size: 13px; color: #1c1e21; flex: 1; min-width: 0; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
        }
        .oynat-simge { color: var(--sinema-ana); font-size: 16px; margin-left: 8px; flex-shrink: 0; }
        
        /* Yükleniyor ve Daha Fazla Butonu */
        .durum-alani { text-align: center; padding: 20px 0; }
        .daha-fazla-btn {
            background: var(--sinema-ana); color: white; border: none;
            padding: 10px 20px; border-radius: 20px; font-weight: bold;
            font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .daha-fazla-btn:hover { background: #c0392b; }
        .yukleniyor { color: #888; font-style: italic; font-size: 13px; }

        @media (max-width: 480px) {
            .film-resim { width: 85px; height: 52px; margin-right: 8px; }
            .film-metin { font-size: 12px; }
            .galeri-baslik { font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- OYNATICI MERKEZİ -->
<div id="sinema-kontrol-merkezi">
    <div class="sinema-wrapper">
        <div id="izlenen-bilgi">
            <span class="canli-etiket">ŞU AN İZLENİYOR</span>
            <span id="film-adi-aktif">Bir film seçin...</span>
        </div>
        <button id="film-kapat-btn" onclick="filmDurdur()">KAPAT ✕</button>
    </div>
    
    <div id="video-oynatici-alan">
        <div class="video-kapsayici">
            <iframe id="film-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
</div>

<!-- FİLM LİSTESİ -->
<section class="film-galerisi">
    <header>
        <h2 class="galeri-baslik">Özel Sinema Seçkisi - Türkçe Dublaj</h2>
        <p class="galeri-alt">nearadin.net tarafından derlenen tüm yabancı filmler.</p>
    </header>
    
    <div id="canli-sonuc-listesi"></div>

    <div class="durum-alani">
        <button id="yukle-btn" class="daha-fazla-btn" onclick="filmleriGetir()" style="display:none;">Daha Fazla Film Yükle ➕</button>
        <div id="yukleniyor-yazi" class="yukleniyor">Filmler taranıyor...</div>
    </div>
</section>

<script>
    // YouTube Data API Ayarları
    const API_KEY = 'AIzaSyB7IgB2_xqru0dYub4yt6K7oY60bhX3D74';
    const SEARCH_QUERY = 'zentii25 türkçe dublaj film'; // Veya aramak istediğiniz anahtar kelime
    let nextPageToken = '';
    let isFetching = false;

    async function filmleriGetir() {
        if (isFetching) return;
        isFetching = true;

        const yukleniyorEl = document.getElementById('yukleniyor-yazi');
        const yukleBtn = document.getElementById('yukle-btn');
        
        yukleniyorEl.style.display = 'block';
        yukleniyorEl.innerText = 'Daha fazla film yükleniyor...';
        yukleBtn.style.display = 'none';

        let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(SEARCH_QUERY)}&type=video&key=${API_KEY}`;
        if (nextPageToken) {
            url += `&pageToken=${nextPageToken}`;
        }

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.items && data.items.length > 0) {
                renderFilmler(data.items);
                nextPageToken = data.nextPageToken || '';
                
                if (nextPageToken) {
                    yukleBtn.style.display = 'inline-block';
                }
            } else {
                yukleniyorEl.innerText = 'Gösterilecek başka film kalmadı.';
            }
        } catch (e) {
            yukleniyorEl.innerText = 'Filmler yüklenirken bağlantı hatası oluştu.';
        } finally {
            isFetching = false;
            if (nextPageToken) yukleniyorEl.style.display = 'none';
        }
    }

    function renderFilmler(items) {
        const container = document.getElementById('canli-sonuc-listesi');
        
        items.forEach(item => {
            if (item.id && item.id.videoId) {
                const s = item.snippet;
                const vId = item.id.videoId;
                
                const card = document.createElement('article');
                card.className = 'film-kart-ozel';
                card.onclick = () => startMovie(vId, s.title, card);
                card.innerHTML = `
                    <img src="${s.thumbnails.medium ? s.thumbnails.medium.url : s.thumbnails.default.url}" class="film-resim" alt="${s.title}">
                    <h3 class="film-metin">${s.title}</h3>
                    <div class="oynat-simge">▶</div>
                `;
                container.appendChild(card);
            }
        });
    }

    function startMovie(id, title, el) {
        const frame = document.getElementById('film-iframe');
        const container = document.getElementById('video-oynatici-alan');
        const btn = document.getElementById('film-kapat-btn');
        const baslik = document.getElementById('film-adi-aktif');
        
        frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        container.style.display = 'block';
        btn.style.display = 'block';
        baslik.innerText = title;
        
        document.querySelectorAll('.film-kart-ozel').forEach(k => k.classList.remove('aktif'));
        el.classList.add('aktif');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filmDurdur() {
        const frame = document.getElementById('film-iframe');
        frame.src = '';
        document.getElementById('video-oynatici-alan').style.display = 'none';
        document.getElementById('film-kapat-btn').style.display = 'none';
        document.getElementById('film-adi-aktif').innerText = 'Bir film seçin...';
        document.querySelectorAll('.film-kart-ozel').forEach(k => k.classList.remove('aktif'));
    }

    // İlk Yükleme
    document.addEventListener('DOMContentLoaded', filmleriGetir);
</script>

</body>
</html>
