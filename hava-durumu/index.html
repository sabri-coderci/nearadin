<body>

    <header>

    <div class="container">
        <a href="/" class="back-btn">← Ana Sayfaya Dön</a>
        <h1>☀️ İl ve İlçe Canlı Hava Durumu</h1>

        <div class="info-box">
            📌 Meteoroloji Genel Müdürlüğü (MGM) anlık hava durumu ve 5 günlük tahmin verileridir.

        <!-- Şehir Seçim Alanı -->
        <div class="selector-box">
            <label for="citySelect">Şehir Seçin:</label>
            <select id="citySelect" onchange="changeCity()">

                <option value="ERZURUM">Erzurum</option>
                <option value="GAZIANTEP">Gaziantep</option>
                <option value="KONYA">Konya</option>
                <option value="TRABZON">Trabzon</option>
                <!-- İhtiyaca göre diğer iller eklenebilir -->
            </select>
        </div>

        <!-- Admatic AUTO ads START -->
        <div class="ad-container">
            <ins data-publisher="adm-pub-342021502" data-ad-network="6938571fadda546eb28ca492" class="adm-ads-area"></ins>

        <div style="text-align: center; margin-top: 25px;">

        </div>
    </div>

    <script>
        function changeCity() {
            const city = document.getElementById('citySelect').value;
            const iframe = document.getElementById('mgmIframe');
            // MGM resmi sunduğu widget URL yapısı
            iframe.src = `https://www.mgm.gov.tr/sunduklarimiz/v2/tahmin/il-ve-ilceler.aspx?m=${city}&baslik=G&bg=FFF&tf=14`;
        }
    </script>
