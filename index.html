    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent);
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .widget {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .widget h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .clock-container {
            text-align: center;
        }

        #time {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
        }

        #date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            text-align: center;
            font-size: 0.8rem;
        }

        .day-name {
            font-weight: 600;
            color: var(--text-muted);
            padding-bottom: 5px;
        }

        .day {
            padding: 8px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
        }

        .day.today {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
        }

        .search-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            min-height: 200px;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* GOOGLE CSE OVERRIDE */
        .gsc-control-cse {
            background-color: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        .gsc-input-box {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            border-radius: 8px !important;
        }

        input.gsc-input {
            background-color: transparent !important;
            color: #ffffff !important;
            padding: 8px 12px !important;
        }

        .gsc-search-button-v2 {
            background-color: var(--primary) !important;
            border-radius: 8px !important;
            border: none !important;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                padding: 10px;
                gap: 15px;
            }

            table.gsc-search-box, 
            table.gsc-search-box td {
                display: block !important;
                width: 100% !important;
            }

            .gsc-search-button-v2 {
                width: 100% !important;
                margin: 8px 0 0 0 !important;
            }
        }
    </style>
</head>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', options);
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- Düzeltilmiş Takvim Hesabı (Pazartesi İndeksli) ---
        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();

            const monthNames = [
                "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",
                "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"
            ];

            document.getElementById('month-year').textContent = `${monthNames[month]} ${year}`;

            // Türkiye/Avrupa standartlarına göre haftanın ilk gününü Pazartesi yapmak:
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; // Pazar gününü sona atar

            const lastDay = new Date(year, month + 1, 0).getDate();
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            // Gün başlıkları (Pazartesi başlar)
            const dayNames = ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pz'];
            dayNames.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day-name');
                dayEl.textContent = day;
                daysContainer.appendChild(dayEl);
            });

            // Boş gün grupları
            for (let i = 0; i < firstDay; i++) {
                const emptyEl = document.createElement('div');
                daysContainer.appendChild(emptyEl);
            }

            // Gün sayıları
            for (let day = 1; day <= lastDay; day++) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                if (day === today) {
                    dayEl.classList.add('today');
                }
                dayEl.textContent = day;
                daysContainer.appendChild(dayEl);
            }
        }

        renderCalendar();
    </script>
