name: Fiyat Takip Botu

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı otomatik çalışır
  workflow_dispatch: # İstediğinizde elle başlatabilmeniz için

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright psycopg2-binary
          playwright install --with-deps chromium

      - name: Botu Çalıştır
        env:
          DB_URL: ${{ secrets.DB_URL }} # Veritabanı bağlantı adresiniz
        run: python main.py
